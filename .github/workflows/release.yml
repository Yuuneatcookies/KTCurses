name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler
        uses: fwilhe2/setup-kotlin@v1
        with:
          version: '2.0.21'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build library
        run: |
          mkdir -p dist
          kotlinc KTCurses.kt -jvm-target 17 -d "dist/ktcurses-${{ steps.ver.outputs.tag }}.jar"
          zip -q -j "dist/ktcurses-${{ steps.ver.outputs.tag }}-sources.zip" KTCurses.kt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: KTCurses ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/ktcurses-${{ steps.ver.outputs.tag }}.jar
            dist/ktcurses-${{ steps.ver.outputs.tag }}-sources.zip
          body: |
            KTCurses ${{ steps.ver.outputs.tag }}

            ### Artifacts
            - `ktcurses-${{ steps.ver.outputs.tag }}.jar` — library
            - `ktcurses-${{ steps.ver.outputs.tag }}-sources.zip` — sources

            ### Usage
            ```kotlin
            dependencies {
                implementation(files("libs/ktcurses-${{ steps.ver.outputs.tag }}.jar"))
            }
            ```
